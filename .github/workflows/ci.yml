name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
        env:
          MONGODB_URI_TEST: mongodb://localhost:27017/auth-backend-test

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: auth-backend:ci

      - name: Generate JWT keys
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/private.pem 2>/dev/null
          openssl rsa -in /tmp/private.pem -pubout -out /tmp/public.pem 2>/dev/null
          JWT_PRIVATE_KEY=$(awk 'NR>1{printf "\\n"}{printf "%s",$0}' /tmp/private.pem)
          JWT_PUBLIC_KEY=$(awk 'NR>1{printf "\\n"}{printf "%s",$0}' /tmp/public.pem)
          echo "::add-mask::$JWT_PRIVATE_KEY"
          echo "::add-mask::$JWT_PUBLIC_KEY"
          PRODUCT_ANALYTICS_PSEUDONYMIZATION_KEY=$(openssl rand -base64 32)
          echo "::add-mask::$PRODUCT_ANALYTICS_PSEUDONYMIZATION_KEY"
          echo "JWT_PRIVATE_KEY=$JWT_PRIVATE_KEY" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY=$JWT_PUBLIC_KEY" >> "$GITHUB_ENV"
          echo "PRODUCT_ANALYTICS_PSEUDONYMIZATION_KEY=$PRODUCT_ANALYTICS_PSEUDONYMIZATION_KEY" >> "$GITHUB_ENV"
          rm /tmp/private.pem /tmp/public.pem

      - name: Generate fake FCM credentials
        run: |
          FCM_SA_JSON=$(printf '{"type":"service_account","project_id":"ci","private_key_id":"ci","private_key":"-----BEGIN RSA PRIVATE KEY-----\\nMIIBogIBAAJBALRiMLAHudeSA/x3hB2f+2NRkJLA5VCe\\n-----END RSA PRIVATE KEY-----\\n","client_email":"ci@ci.iam.gserviceaccount.com","client_id":"1","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","auth_provider_x509_cert_url":"https://www.googleapis.com/oauth2/v1/certs","client_x509_cert_url":"https://www.googleapis.com/robot/v1/metadata/x509/ci","universe_domain":"googleapis.com"}' | base64 -w0)
          echo "FCM_SA_JSON=$FCM_SA_JSON" >> "$GITHUB_ENV"

      - name: Start services
        run: |
          docker network create ci-net
          docker run -d --name mongo-ci --network ci-net mongo:7
          sleep 3
          docker run -d --name auth-ci --network ci-net -p 3001:3001 \
            -e MONGODB_URI=mongodb://mongo-ci:27017/auth-ci \
            -e JWT_PRIVATE_KEY="$JWT_PRIVATE_KEY" \
            -e JWT_PUBLIC_KEY="$JWT_PUBLIC_KEY" \
            -e GITHUB_CLIENT_ID=ci-test \
            -e GITHUB_CLIENT_SECRET=ci-test \
            -e GOOGLE_CLIENT_ID=ci-test \
            -e GOOGLE_CLIENT_SECRET=ci-test \
            -e ALLOWED_REDIRECT_URIS=http://localhost:3000/callback \
            -e RELAY_URL=ws://localhost:8080 \
            -e "PRODUCT_ANALYTICS_PSEUDONYMIZATION_KEY=$PRODUCT_ANALYTICS_PSEUDONYMIZATION_KEY" \
            -e OPENAI_API_KEY=ci-test \
            -e "FCM_SA_JSON=$FCM_SA_JSON" \
            -e APPLE_CLIENT_ID=ci-test \
            -e APPLE_IOS_CLIENT_ID=ci-test \
            -e APPLE_TEAM_ID=ci-test \
            -e APPLE_KEY_ID=ci-test \
            -e APPLE_PRIVATE_KEY=ci-test \
            auth-backend:ci
          sleep 5

      - name: Health check
        run: |
          response=$(curl -sf http://localhost:3001/health)
          echo "Health response: $response"
          echo "$response" | jq -e '.status == "ok"'

      - name: Graceful shutdown under an in-flight long poll
        run: |
          TOKEN=$(printf 'a%.0s' {1..64})
          curl -sf -X POST http://localhost:3001/auth/github/init \
            -H "content-type: application/json" \
            -H "x-sesori-session-token: $TOKEN" \
            -d '{"clientType":"app_macos"}' > /dev/null
          curl -sS -m 40 -o /tmp/poll-body -w '%{http_code}' \
            http://localhost:3001/auth/session/status \
            -H "x-sesori-session-token: $TOKEN" > /tmp/poll-status &
          POLL_PID=$!
          for _ in {1..50}; do
            docker logs auth-ci 2>&1 | grep -qF '[PendingAuthStore] Status waiter registered' && break
            sleep 0.1
          done
          docker logs auth-ci 2>&1 | grep -qF '[PendingAuthStore] Status waiter registered'
          kill -0 "$POLL_PID"
          STARTED_AT=$(date +%s)
          docker stop --time 25 auth-ci
          ELAPSED_SECONDS=$(( $(date +%s) - STARTED_AT ))
          wait "$POLL_PID"
          test "$(cat /tmp/poll-status)" = "200"
          jq -e '.status == "pending"' /tmp/poll-body
          test "$ELAPSED_SECONDS" -lt 10
          test "$(docker inspect --format '{{.State.ExitCode}}' auth-ci)" = "0"
          docker logs auth-ci > /tmp/auth-ci.log 2>&1
          REGISTER_LINE=$(grep -nF '[PendingAuthStore] Status waiter registered' /tmp/auth-ci.log | cut -d: -f1 | tail -1)
          SHUTDOWN_LINE=$(grep -n '\[Shutdown\] Started' /tmp/auth-ci.log | cut -d: -f1 | tail -1)
          RELEASE_LINE=$(grep -nF '[PendingAuthStore] Status waiters released' /tmp/auth-ci.log | cut -d: -f1 | tail -1)
          MONGO_CLOSE_LINE=$(grep -n 'MongoDB connection closed' /tmp/auth-ci.log | cut -d: -f1 | tail -1)
          test -n "$REGISTER_LINE" && test -n "$SHUTDOWN_LINE" && test -n "$RELEASE_LINE" && test -n "$MONGO_CLOSE_LINE"
          test "$REGISTER_LINE" -lt "$SHUTDOWN_LINE"
          test "$SHUTDOWN_LINE" -lt "$RELEASE_LINE"
          test "$RELEASE_LINE" -lt "$MONGO_CLOSE_LINE"

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "=== auth-ci logs ==="
          docker logs auth-ci 2>&1 || true
          echo "=== mongo-ci logs ==="
          docker logs mongo-ci 2>&1 || true

      - name: Stop services
        if: always()
        run: |
          docker rm -f auth-ci mongo-ci || true
          docker network rm ci-net || true
